{% extends "base.html" %}

{% block content %}
<h1 class="display-5 fw-bold mb-4">Delete tag</h1>

<p>Are you sure you want to delete tag "{{ object.name }}"?</p>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Yes, delete</button>
  <a href="{% url 'todo:tag-list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
