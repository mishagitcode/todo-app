{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-start mb-4">
  <h1 class="display-2 fw-bold">Tags</h1>
  <a href="{% url 'app:tag-create' %}" class="btn btn-primary btn-lg">Add</a>
</div>

<table class="table align-middle">
  <thead>
    <tr style="font-size: 24px;">
      <th>Name</th>
      <th>Update</th>
      <th>Delete</th>
    </tr>
  </thead>
  <tbody>
    {% for tag in tag_list %}
      <tr style="font-size: 22px;">
        <td>{{ tag.name }}</td>
        <td>
          <a href="{% url 'app:tag-update' tag.pk %}" class="btn btn-secondary btn-lg">Update</a>
        </td>
        <td>
          <a href="{% url 'app:tag-delete' tag.pk %}" class="btn btn-secondary btn-lg">Delete</a>
        </td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="3">No tags yet.</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
